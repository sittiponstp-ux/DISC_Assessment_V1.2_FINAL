<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DISC Assessment | สัตว์ 4 ทิศ</title><link rel="stylesheet" href="style.css"></head><body><main class="app">
<section id="welcome" class="screen active"><div class="card hero"><div>DISC ASSESSMENT</div><h1>แบบประเมิน DISC<br>สัตว์ 4 ทิศ</h1><p>รู้จักตัวเอง • เข้าใจผู้อื่น • ทำงานร่วมกันได้ดีขึ้น</p><button onclick="show('info')">เริ่มทำแบบทดสอบ</button></div></section>
<section id="info" class="screen"><div class="card"><h2>ข้อมูลผู้ทำแบบประเมิน</h2><label>รหัสพนักงาน<input id="employeeId"></label><label>ชื่อ-นามสกุล<input id="employeeName"></label><label>ฝ่าย<input id="division"></label><label>แผนก<input id="department"></label><button onclick="start()">เริ่มทำแบบทดสอบ 24 ข้อ</button></div></section>
<section id="quiz" class="screen"><div class="quizbox"><div id="progress"></div><div class="bar"><i id="bar"></i></div><div class="card"><h2 id="qText"></h2><div id="options"></div></div><div class="nav"><button id="back" class="secondary" onclick="prev()">ย้อนกลับ</button><button onclick="next()" id="next">ถัดไป</button></div></div></section>
<section id="processing" class="screen"><div class="card center"><div class="spinner"></div><h2>กำลังประมวลผลผลลัพธ์</h2></div></section>
<section id="result" class="screen"><div class="result-wrap"><div id="resultCard" class="card"></div><button onclick="window.print()">บันทึก / พิมพ์ Result Card</button><button class="secondary" onclick="show('welcome')">ทำแบบทดสอบใหม่</button></div></section>
</main><script src="questions.js"></script><script src="profiles.js"></script><script src="app.js"></script></body></html>
